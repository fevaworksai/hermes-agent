<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>專案導覽 · Project Navigator</title>
<style>
:root{
  --bg:#f2f4f8; --card:#ffffff; --ink:#1b2430; --dim:#5b6675; --line:#dde3ec;
  --brand:#1d4ed8; --brand-soft:#e3ecff; --ok:#0e9f6e; --ok-soft:#d9f4e9;
  --dev:#d97706; --dev-soft:#fdf0dc;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang HK","Microsoft JhengHei",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1100px;margin:0 auto;padding:32px 16px 56px}
header{text-align:center;margin-bottom:26px}
header .logo{font-size:44px}
header h1{font-size:28px;letter-spacing:-.01em;margin-top:4px}
header p{color:var(--dim);font-size:15px;margin-top:4px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:22px}
.toolbar input{
  flex:1;min-width:220px;max-width:460px;font-size:15px;padding:11px 16px;
  border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)
}
.toolbar input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px}
.chip{
  font-size:14px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);
  background:#fff;color:var(--dim);cursor:pointer;font-family:inherit
}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.active{background:var(--brand);border-color:var(--brand);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:18px;justify-content:center}
.pcard{
  flex:1 1 300px;max-width:370px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;
  display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s
}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(29,78,216,.12)}
.pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .icon{font-size:34px;line-height:1}
.pcard h2{font-size:18px}
.pcard .desc{font-size:14px;color:var(--dim);flex:1}
.pcard .stack{display:flex;flex-wrap:wrap;gap:6px}
.tag{
  font-size:12px;padding:3px 10px;border-radius:999px;background:var(--brand-soft);
  color:var(--brand);font-weight:600
}
.status{font-size:12.5px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap}
.status.online{background:var(--ok-soft);color:var(--ok)}
.status.dev{background:var(--dev-soft);color:var(--dev)}
.pcard .open{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px;border-radius:12px;background:var(--brand);color:#fff;text-decoration:none;
  font-size:15px;font-weight:600;transition:filter .15s
}
.pcard .open:hover{filter:brightness(1.08)}
.empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:44px 0;font-size:15px}
.state-msg{text-align:center;color:var(--dim);padding:30px 0;font-size:15px}
footer{text-align:center;color:var(--dim);font-size:13px;margin-top:34px}
footer code{background:#e8edf7;padding:2px 7px;border-radius:6px}
@media(max-width:600px){
  header h1{font-size:24px}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="logo">🧭</div>
  <h1>專案導覽</h1>
  <p>Fevaworks AI · Web App 專案總覽</p>
</header>

<div class="toolbar">
  <input type="search" id="search" placeholder="搜尋專案名稱、簡介或技術堆疊…" aria-label="搜尋專案">
</div>
<div class="chips" id="chips" role="tablist" aria-label="分類篩選"></div>

<div class="grid" id="grid" aria-live="polite"></div>
<div class="state-msg" id="state" style="display:none"></div>

<footer>
  新增專案：編輯 <code>projects.json</code> 即可，無需改動頁面程式碼
</footer>
</div>

<script>
let PROJECTS = [];
let state = {q:"", cat:"all"};

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderChips(){
  const cats = ["all", ...new Set(PROJECTS.map(p => p.category).filter(Boolean))];
  document.getElementById("chips").innerHTML = cats.map(c =>
    `<button class="chip ${state.cat===c?'active':''}" data-cat="${esc(c)}" role="tab" aria-selected="${state.cat===c}">${c==='all'?'全部':esc(c)}</button>`).join("");
  document.querySelectorAll(".chip").forEach(ch => ch.addEventListener("click", () => {
    state.cat = ch.dataset.cat; renderChips(); renderGrid();
  }));
}

function matches(p){
  if(state.cat !== "all" && p.category !== state.cat) return false;
  const q = state.q.trim().toLowerCase();
  if(!q) return true;
  return [p.name, p.desc, p.category, ...(p.stack||[])].join(" ").toLowerCase().includes(q);
}

function renderGrid(){
  const list = PROJECTS.filter(matches);
  const grid = document.getElementById("grid");
  const empty = document.getElementById("state");
  if(!list.length){
    grid.innerHTML = "";
    empty.style.display = "block";
    empty.textContent = state.q ? `搵唔到符合「${state.q}」嘅專案，試吓其他關鍵字或重設分類。` : "未有符合分類嘅專案。";
    return;
  }
  empty.style.display = "none";
  grid.innerHTML = list.map(p => `
    <article class="pcard">
      <div class="top">
        <span class="icon">${esc(p.icon || "📦")}</span>
        <span class="status ${p.status === "已上線" ? "online" : "dev"}">${esc(p.status || "開發中")}</span>
      </div>
      <h2>${esc(p.name)}</h2>
      <p class="desc">${esc(p.desc)}</p>
      <div class="stack">${(p.stack||[]).map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div>
      <a class="open" href="${esc(p.url)}" ${p.url.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>🚀 開啟專案</a>
    </article>`).join("");
}

async function load(){
  const msg = document.getElementById("state");
  msg.style.display = "block";
  msg.textContent = "載入專案資料中…";
  try{
    const res = await fetch("projects.json", {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    PROJECTS = await res.json();
    if(!Array.isArray(PROJECTS)) throw new Error("格式錯誤");
  }catch(e){
    msg.textContent = "無法載入 projects.json（" + e.message + "），請檢查檔案是否存在及格式是否正確。";
    return;
  }
  msg.style.display = "none";
  renderChips();
  renderGrid();
}

document.getElementById("search").addEventListener("input", e => {
  state.q = e.target.value; renderGrid();
});
load();
</script>
</body>
</html>
